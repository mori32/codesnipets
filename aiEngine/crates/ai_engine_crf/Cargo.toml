[package]
name = "ai_engine_crf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
llama-cpp = ["dep:ai_engine_llm", "ai_engine_llm/llama-cpp"]

[dependencies]
ai_engine_dict = { path = "../ai_engine_dict" }
ai_engine_llm = { path = "../ai_engine_llm", optional = true }
bzip2 = "0.6"
rayon = "1.12"
scc = "3.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true

[[bin]]
name = "crf-llm-alpha"
path = "src/bin/crf-llm-alpha.rs"
required-features = ["llama-cpp"]
